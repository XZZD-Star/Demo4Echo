[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "echomate-core"
version = "0.1.0"
description = "Shared Echo-Mate assistant, memory and notification core"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "tzdata>=2024.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["echomate_core*"]
